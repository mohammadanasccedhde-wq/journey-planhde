<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#0b6b5c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>Journey Plan Form</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1a1a1a;--bd:#c9ccd1;--ac:#0b6b5c;color-scheme:light dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171a;--card:#1f2226;--tx:#eceff1;--bd:#3a3f45;--ac:#35b9a3}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Arial,Helvetica,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:12px}
h1{font-size:18px;margin:6px 0 10px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
label{font-size:11px;font-weight:bold;display:block;margin-bottom:2px}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font-size:14px}
.btns{display:flex;gap:8px;margin:12px 0;flex-wrap:wrap}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:12px 18px;font-size:15px;font-weight:bold;cursor:pointer}
button.big{padding:18px;font-size:18px;width:100%}button.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
#box{background:#fff;border-radius:6px;overflow:hidden;width:100%}
#sheet{position:relative;width:931px;height:667px;background:#fff;color:#000;transform-origin:0 0}
#sheet div{position:absolute}
.l{background:#000}
.c{display:flex;align-items:center;justify-content:center;white-space:nowrap;overflow:hidden;font-family:Arial,Helvetica,sans-serif;font-weight:bold;font-size:7px;padding:0 2px;line-height:1.1}
.c.L{justify-content:flex-start}
.c span{display:inline-block;white-space:nowrap}
.t{font-family:"Times New Roman",Times,serif;font-weight:normal}
.u span{text-decoration:underline}
.f{font-weight:normal}.n{font-weight:normal;font-size:10.4px;justify-content:flex-start;padding:0}
#adm{position:fixed;left:0;right:0;top:0;bottom:0;background:rgba(0,0,0,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:9;padding:16px 10px}
#adm .m{background:var(--card);color:var(--tx);border-radius:10px;padding:14px;width:100%;max-width:680px}
#adm table{width:100%;border-collapse:collapse;margin:8px 0}#adm td{padding:3px}#adm td input{padding:6px;font-size:13px}
#adm button{padding:8px 12px;font-size:13px;border-radius:6px}#adm button.dl{background:#b3261e}#adm button:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:11px;margin-top:2px;min-height:13px}
input[readonly]{opacity:.75}
@page{size:A4 landscape;margin:8mm}
@media print{body{background:#fff}.no{display:none!important}.wrap{padding:0;max-width:none}#box{width:1004px!important;height:721px!important;border-radius:0}#sheet{transform:scale(1.078)!important}}
</style></head><body><div class="wrap">
<div id="v_home" class="no"><div style="text-align:center;padding:30px 0 6px"><img id="homeLogo" alt="Al Haditha Energy" style="height:90px"><h1 style="font-size:24px;margin:16px 0 4px">Journey Plan Form</h1><div style="opacity:.7;font-size:13px">Create journey plans and manage master data</div></div><div style="display:grid;gap:12px;max-width:360px;margin:22px auto"><button class="big" onclick="show('create')">Create</button><button class="big sec" onclick="admOpen()">Admin</button></div></div>
<div id="v_create" style="display:none"><div class="no"><button class="sec" onclick="show('home')" style="margin:4px 0 8px;padding:8px 14px;font-size:13px">&larr; Home</button></div>
<div class="no"><h1>Journey Plan Form</h1>
<div class="panel"><div class="grid" id="f"></div>
<div class="btns"><button onclick="window.print()">Print / Save as PDF</button><button class="sec" onclick="reset()">Clear form</button></div>
